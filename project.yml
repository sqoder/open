name: siqi
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  libghostty-spm:
    url: https://github.com/egoist-labs/libghostty-spm
    from: 1.3.7

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Manual
    # Stable certificate (not ad-hoc) so TCC permissions survive rebuilds
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: FLRWBQKUYW
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  siqi:
    type: application
    platform: macOS
    sources:
      - siqi
    dependencies:
      - package: libghostty-spm
        product: GhosttyTerminal
      - package: libghostty-spm
        product: GhosttyTheme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siqi.terminal
        PRODUCT_NAME: siqi
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: siqi/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: siqi/Resources/siqi.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_DEBUG_DYLIB: NO
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        DEAD_CODE_STRIPPING: YES
        STRIP_INSTALLED_PRODUCT: YES
        COPY_PHASE_STRIP: YES
        DEPLOYMENT_POSTPROCESSING: YES
        STRIP_STYLE: non-global
        MARKETING_VERSION: 0.0.27
        CURRENT_PROJECT_VERSION: 27
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  siqiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - tests
    dependencies:
      - target: siqi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siqi.terminal.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  siqi:
    build:
      targets:
        siqi: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - siqiTests
