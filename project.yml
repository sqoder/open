name: suqi
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  libghostty-spm:
    url: https://github.com/egoist-labs/libghostty-spm
    from: 1.3.7

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  suqi:
    type: application
    platform: macOS
    sources:
      - suqi
    dependencies:
      - package: libghostty-spm
        product: GhosttyTerminal
      - package: libghostty-spm
        product: GhosttyTheme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suqi.terminal
        PRODUCT_NAME: suqi
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: suqi/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: suqi/Resources/suqi.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_DEBUG_DYLIB: NO
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        DEAD_CODE_STRIPPING: YES
        STRIP_INSTALLED_PRODUCT: YES
        COPY_PHASE_STRIP: YES
        DEPLOYMENT_POSTPROCESSING: YES
        STRIP_STYLE: non-global
        MARKETING_VERSION: 0.0.25
        CURRENT_PROJECT_VERSION: 25
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  suqi:
    build:
      targets:
        suqi: all
    run:
      config: Debug
